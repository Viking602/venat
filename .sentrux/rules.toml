# Venat structural rules — enforced by `sentrux check .`.
#
# ADR-031 defines the exhaustive production capability graph:
#
#   message      skill
#      |           |
#      +-- provider|
#      +-- tool    |
#           \      /
#             agent
# Sentrux enforces graph-wide cycles and file coupling. The exact package
# allowlist, including Production/TestImports/XTestImports and fail-closed
# required scopes, is enforced by scripts/check-import-boundaries.sh.
# scripts/check-legacy-absence.sh rejects deleted surfaces and unexpected
# production packages. scripts/check-public-any.sh enforces exported shapes.

[constraints]
max_cycles = 0
max_coupling = "B"
no_god_files = true
