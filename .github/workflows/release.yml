name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      resolved-commit: ${{ steps.resolve-tag.outputs.commit }}

    env:
      SENTRUX_VERSION: v0.5.7
      SENTRUX_SHA256: 3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6
      SENTRUX_GRAMMARS_SHA256: 8849f1eb07df3f6d4ea1ed422d8dee4b9b79a250682fa5646675dae466554454
      SENTRUX_GO_GRAMMAR_SHA256: 4ad143e1da83af843d15e7efb9209b867c25f31f65a96ebdeb281ab958789072
      SENTRUX_PLUGIN_COMMIT: f36da08a53e7f06c5b6aec33eb05816b371000ea
      SENTRUX_GO_MANIFEST_SHA256: 78ffd1982051035d70f26d1bbb8ab7c5f65f1ee63f756e7ce244b9eafe712753
      SENTRUX_GO_QUERY_SHA256: 3f2a406d19c7db7be6529f28fc0b38637a419c9f7a7b4be5ba50d0c0ece1d94c

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify tag commit
        id: resolve-tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${TAG}:refs/tags/${TAG}"
          EVENT_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "$TAG_COMMIT" != "$EVENT_COMMIT" ]; then
            echo "::error::Release tag ${TAG} moved from ${EVENT_COMMIT} to ${TAG_COMMIT}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag ${TAG} points to ${TAG_COMMIT}, which is not on origin/main"
            exit 1
          fi
          echo "commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install verified sentrux and Go plugin
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl -fsSL -o "$TMP_DIR/sentrux" \
            "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/sentrux-linux-x86_64"
          echo "${SENTRUX_SHA256}  $TMP_DIR/sentrux" | sha256sum -c -
          install -m 0755 "$TMP_DIR/sentrux" /usr/local/bin/sentrux

          curl -fsSL -o "$TMP_DIR/grammars.tar.gz" \
            "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/grammars-linux-x86_64.tar.gz"
          echo "${SENTRUX_GRAMMARS_SHA256}  $TMP_DIR/grammars.tar.gz" | sha256sum -c -
          tar -xzf "$TMP_DIR/grammars.tar.gz" -C "$TMP_DIR" go/grammars/linux-x86_64.so
          echo "${SENTRUX_GO_GRAMMAR_SHA256}  $TMP_DIR/go/grammars/linux-x86_64.so" | sha256sum -c -

          mkdir -p "$HOME/.sentrux/plugins/go/queries" "$HOME/.sentrux/plugins/go/grammars"
          curl -fsSL -o "$HOME/.sentrux/plugins/go/plugin.toml" \
            "https://raw.githubusercontent.com/sentrux/sentrux/${SENTRUX_PLUGIN_COMMIT}/plugins/go/plugin.toml"
          curl -fsSL -o "$HOME/.sentrux/plugins/go/queries/tags.scm" \
            "https://raw.githubusercontent.com/sentrux/sentrux/${SENTRUX_PLUGIN_COMMIT}/plugins/go/queries/tags.scm"
          echo "${SENTRUX_GO_MANIFEST_SHA256}  $HOME/.sentrux/plugins/go/plugin.toml" | sha256sum -c -
          echo "${SENTRUX_GO_QUERY_SHA256}  $HOME/.sentrux/plugins/go/queries/tags.scm" | sha256sum -c -
          install -m 0644 "$TMP_DIR/go/grammars/linux-x86_64.so" \
            "$HOME/.sentrux/plugins/go/grammars/linux-x86_64.so"

          test "$(sentrux --version)" = "sentrux ${SENTRUX_VERSION#v}"
          sentrux plugin validate "$HOME/.sentrux/plugins/go"

      - name: Validate release tag and module major version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MODULE="$(go list -m)"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be valid semver like v0.1.0 or v1.2.3-rc.1"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          if (( MAJOR >= 2 )); then
            if [[ "$MODULE" != */v"${MAJOR}" ]]; then
              echo "Go module major releases v${MAJOR}.x.y require the module path to end with /v${MAJOR}"
              echo "Current module path: ${MODULE}"
              exit 1
            fi
          fi

      - name: Validate release documentation
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE_TAG="${TAG%%[-+]*}"
          TAG_WITHOUT_BUILD="${TAG%%+*}"
          NOTES_PATH="docs/release-notes/${BASE_TAG}.md"
          test -f "$NOTES_PATH"
          if [[ "$TAG_WITHOUT_BUILD" == *-* ]]; then
            grep -Fxq 'Status: **Prerelease**' "$NOTES_PATH"
          else
            grep -Fxq 'Status: **Released**' "$NOTES_PATH"
            grep -Fq "releases/tag/${TAG}" README.md
            if grep -Fqi "unreleased ${BASE_TAG}" README.md; then
              echo "::error::README still marks ${BASE_TAG} as unreleased"
              exit 1
            fi
          fi

      - name: Run full CI parity gate
        run: make ci-local

      - name: Collect coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Run repeatability soak
        run: go test ./... -count=20

      - name: Run race soak
        run: go test -race -timeout=10m ./... -count=5

      - name: Verify tagged Agent SDK consumer
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          export GOPROXY=direct

          mkdir -p "$TMP_DIR/consumer"
          cd "$TMP_DIR/consumer"
          go mod init example.com/venat-release-consumer
          cat > consumer.go <<'EOF'
          package consumer

          import (
              "context"

              "github.com/Viking602/venat/agent"
              "github.com/Viking602/venat/provider"
              "github.com/Viking602/venat/provider/scripted"
          )

          func RunAgent(ctx context.Context) agent.Result {
              engine := agent.Engine{
                  Provider: scripted.New([]provider.Event{
                      {Kind: provider.EventTextDelta, Text: "tagged consumer"},
                      {Kind: provider.EventDone, StopReason: provider.StopReasonComplete},
                  }),
                  Model: "scripted",
              }
              return engine.Run(ctx, agent.Request{Prompt: "verify"}, agent.OutputPolicy{})
          }
          EOF
          cat > consumer_test.go <<'EOF'
          package consumer

          import (
              "context"
              "testing"
          )

          func TestDirectConsumers(t *testing.T) {
              result := RunAgent(context.Background())
              if result.Failure != nil || result.Text != "tagged consumer" {
                  t.Fatalf("Agent result = %#v", result)
              }
          }
          EOF
          go mod edit -require="github.com/Viking602/venat@${GITHUB_REF_NAME}"
          go mod tidy
          go test ./...
          go build ./...

  release:
    needs:
      - release-gate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Revalidate tag and create GitHub release
        env:
          EXPECTED_COMMIT: ${{ needs.release-gate.outputs.resolved-commit }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_COMMIT"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          git -C "$TMP_DIR" init --quiet
          git -C "$TMP_DIR" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$TMP_DIR" fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${TAG}:refs/tags/${TAG}"
          REMOTE_COMMIT="$(git -C "$TMP_DIR" rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "$REMOTE_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Release tag ${TAG} moved from ${EXPECTED_COMMIT} to ${REMOTE_COMMIT}"
            exit 1
          fi
          if ! git -C "$TMP_DIR" merge-base --is-ancestor "$REMOTE_COMMIT" origin/main; then
            echo "::error::Release tag ${TAG} is no longer contained in origin/main"
            exit 1
          fi
          BASE_TAG="${TAG%%[-+]*}"
          TAG_WITHOUT_BUILD="${TAG%%+*}"
          NOTES_PATH="docs/release-notes/${BASE_TAG}.md"
          git -C "$TMP_DIR" show "${REMOTE_COMMIT}:${NOTES_PATH}" > "$TMP_DIR/release-notes.md"
          NOTES="$(cat "$TMP_DIR/release-notes.md")"
          RELEASE_FLAGS=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --notes "$NOTES"
            --title "$TAG"
          )
          if [[ "$TAG_WITHOUT_BUILD" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            "${RELEASE_FLAGS[@]}"
